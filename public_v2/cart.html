<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | UniCloth</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="header-main">
    <div class="logo"><a href="index.html"><h1>UniCloth</h1></a></div>
    <div class="header-icons" id="auth-links"></div>
    <div class="header-icons" style="margin-left: 20px;">
      <a href="cart.html" class="icon-link">🛒 Cart <span class="badge-count" id="cart-count">0</span></a>
    </div>
  </div>

  <nav class="main-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Continue Shopping</a></li>
    </ul>
  </nav>

  <h2 class="section-title" style="margin-top: 40px; font-size: 24px;">Shopping Cart</h2>

  <div class="cart-page-layout">
    <div style="overflow-x: auto;">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Product Details</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="cart-items-body"></tbody>
      </table>
    </div>

    <div>
      <div class="summary-box">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">৳0</span>
        </div>
        <div class="summary-row">
          <span>Shipping (Standard)</span>
          <span id="delivery">৳80</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total</span>
          <span id="total">৳0</span>
        </div>
        <button onclick="proceedToCheckout()" class="btn btn-primary" style="width:100%; text-align:center; margin-top:25px; padding:12px;">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    function proceedToCheckout() {
      const token = localStorage.getItem('unicloth_token');
      if (!token) {
        showToast('Please login or register to place an order!', 'error');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return;
      }
      window.location.href = 'checkout.html';
    }

    function renderCartPage() {
      let cart = JSON.parse(localStorage.getItem('unicloth_cart') || '[]');
      const tbody = document.getElementById('cart-items-body');
      
      if(cart.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px;">Your cart is empty. <br><br><a href="products.html" class="btn btn-primary">Shop Now</a></td></tr>';
        document.getElementById('subtotal').innerText = '৳0';
        document.getElementById('total').innerText = '৳0';
        return;
      }

      let subtotal = 0;
      tbody.innerHTML = cart.map((item, index) => {
        subtotal += item.price * item.qty;
        return `
          <tr>
            <td>
              <div class="cart-product">
                <img src="${item.image}" alt="${item.name}">
                <div>
                  <div style="font-weight: 500;">${item.name}</div>
                  <div style="color: var(--text-light); font-size: 13px; margin-top: 5px;">Unit Price: ৳${item.price}</div>
                </div>
              </div>
            </td>
            <td>
              <div class="qty-wrap">
                <button onclick="updateQty(${index}, -1)">-</button>
                <span>${item.qty}</span>
                <button onclick="updateQty(${index}, 1)">+</button>
              </div>
            </td>
            <td style="font-weight: 600;">৳${item.price * item.qty}</td>
            <td>
              <button class="remove-btn" onclick="removeItem(${index})">✕ Remove</button>
            </td>
          </tr>
        `;
      }).join('');

      let delivery = subtotal >= 2000 ? 0 : 80;
      document.getElementById('subtotal').innerText = `৳${subtotal}`;
      document.getElementById('delivery').innerText = delivery === 0 ? 'Free' : `৳${delivery}`;
      document.getElementById('total').innerText = `৳${subtotal + delivery}`;
    }

    function updateQty(index, delta) {
      let cart = JSON.parse(localStorage.getItem('unicloth_cart') || '[]');
      if(cart[index].qty + delta > 0) {
        cart[index].qty += delta;
      }
      localStorage.setItem('unicloth_cart', JSON.stringify(cart));
      renderCartPage();
      updateCartBadge();
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('unicloth_cart') || '[]');
      cart.splice(index, 1);
      localStorage.setItem('unicloth_cart', JSON.stringify(cart));
      renderCartPage();
      updateCartBadge();
    }

    document.addEventListener('DOMContentLoaded', renderCartPage);
  </script>
</body>
</html>
