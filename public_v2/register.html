<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - UniCloth</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-main" style="border-bottom: 1px solid var(--border); padding: 15px 5%; background: var(--white);">
    <div class="logo"><a href="index.html"><h1>UniCloth</h1></a></div>
    <div class="header-icons">
      <a href="login.html" class="icon-link">Login Instead</a>
    </div>
  </div>

  <div class="auth-container">
    <h2 style="margin-bottom: 20px; text-align: center;">Register</h2>
    <form id="register-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="phone" class="form-control">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 20px;">
      Already have an account? <a href="login.html" style="color: var(--secondary);">Login</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;

      try {
        const res = await apiCall('/auth/register', 'POST', { name, email, phone, password });
        localStorage.setItem('unicloth_token', res.token);
        localStorage.setItem('unicloth_user', JSON.stringify(res.user));
        window.location.href = 'index.html';
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
